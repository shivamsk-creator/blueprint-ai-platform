# Supabase Local Development Configuration — Blueprint AI
project_id = "blueprint-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "pgmq_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/api/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[storage]
enabled = true
file_size_limit = "25MiB"

[storage.buckets.project-files]
public = false
file_size_limit = "25MiB"
allowed_mime_types = [
  "application/pdf",
  "text/plain",
  "text/markdown",
  "application/json",
  "text/csv",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "image/png",
  "image/jpeg",
  "image/webp"
]

[storage.buckets.exports]
public = false
file_size_limit = "50MiB"
allowed_mime_types = [
  "application/pdf",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "text/markdown",
  "application/json",
  "application/sql",
  "text/plain",
  "application/yaml",
  "application/zip"
]
